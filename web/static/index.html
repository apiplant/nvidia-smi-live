<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>nvidia-smi-live · GPU Monitor</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script>
  // Set the theme before first paint so there is no flash of the wrong mode.
  (function () {
    var t = localStorage.getItem("nsl-theme");
    if (t !== "light" && t !== "dark") t = "dark";
    document.documentElement.dataset.theme = t;
  })();
</script>
<script src="/vendor/tailwind.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: "var(--c-bg)",
          panel: "var(--c-panel)",
          border: "var(--c-border)",
          accent: "var(--c-accent)",
          cyan: "var(--c-cyan)",
          green: "var(--c-green)",
          yellow: "var(--c-yellow)",
          red: "var(--c-red)",
          dim: "var(--c-dim)",
          ink: "var(--c-ink)",
          "ink-soft": "var(--c-ink-soft)",
          "ink-faint": "var(--c-ink-faint)",
          track: "var(--c-track)",
          rowline: "var(--c-row-border)",
          rowhover: "var(--c-row-hover)",
        },
        fontFamily: {
          mono: ["ui-monospace", "SFMono-Regular", "Menlo", "monospace"],
        },
      },
    },
  };
</script>
<style>
  /* Dark = Catppuccin Mocha (default). Light = Catppuccin Latte. */
  :root {
    --c-bg: #1e2136;
    --c-panel: #24283b;
    --c-border: #58628c;
    --c-accent: #89b4fa;
    --c-cyan: #94e2d5;
    --c-green: #a6e3a1;
    --c-yellow: #f9e2af;
    --c-red: #f38ba8;
    --c-dim: #6c7086;
    --c-ink: #e6e9f2;
    --c-ink-soft: #a3a8c0;
    --c-ink-faint: #6c7086;
    --c-track: rgba(0, 0, 0, 0.4);
    --c-glass-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
    --c-glass-border: rgba(255, 255, 255, 0.08);
    --c-row-border: rgba(255, 255, 255, 0.05);
    --c-row-hover: rgba(255, 255, 255, 0.05);
    --c-glow1: rgba(137, 180, 250, 0.07);
    --c-glow2: rgba(148, 226, 213, 0.06);
    --c-scrollbar: rgba(255, 255, 255, 0.15);
  }
  :root[data-theme="light"] {
    --c-bg: #eff1f8;
    --c-panel: #ffffff;
    --c-border: #c5cbe8;
    --c-accent: #1e66f5;
    --c-cyan: #179299;
    --c-green: #40a02b;
    --c-yellow: #b45309;
    --c-red: #d20f39;
    --c-dim: #7c8199;
    --c-ink: #1e2136;
    --c-ink-soft: #4a4f6a;
    --c-ink-faint: #8a8fa8;
    --c-track: rgba(0, 0, 0, 0.08);
    --c-glass-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.6));
    --c-glass-border: rgba(30, 33, 54, 0.1);
    --c-row-border: rgba(30, 33, 54, 0.06);
    --c-row-hover: rgba(30, 33, 54, 0.04);
    --c-glow1: rgba(30, 102, 245, 0.06);
    --c-glow2: rgba(23, 146, 153, 0.05);
    --c-scrollbar: rgba(30, 33, 54, 0.2);
  }
  body {
    background:
      radial-gradient(circle at 15% 0%, var(--c-glow1), transparent 40%),
      radial-gradient(circle at 85% 20%, var(--c-glow2), transparent 45%),
      var(--c-bg);
  }
  .glass {
    background: var(--c-glass-bg);
    border: 1px solid var(--c-glass-border);
    backdrop-filter: blur(8px);
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--c-scrollbar); border-radius: 4px; }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 var(--c-glow1); }
    50% { opacity: 0.6; box-shadow: 0 0 0 4px transparent; }
  }
  .live-dot { animation: pulse-dot 2s ease-in-out infinite; }
</style>
</head>
<body class="min-h-screen text-ink font-sans">

<div id="app"></div>

<script type="importmap">
{
  "imports": {
    "solid-js": "/vendor/solid-js.mjs",
    "solid-js/web": "/vendor/web.mjs"
  }
}
</script>

<script type="module">
import { createSignal, createMemo, For, Show, onSettled } from "solid-js";
import { render } from "solid-js/web";
import html from "/vendor/html.mjs";

const REFRESH_MS = 1000;

function initialTheme() {
  return document.documentElement.dataset.theme === "light" ? "light" : "dark";
}

function fmtMem(mib, unit) {
  if (mib == null) return "N/A";
  if (unit === "MiB") return `${mib} MiB`;
  if (unit === "GiB") return `${(mib / 1024).toFixed(1)} GiB`;
  return `${(mib / 1024 / 1024).toFixed(2)} TiB`;
}

function fmtMemRange(used, total, unit) {
  if (unit === "MiB") return `${used}/${total} MiB`;
  if (unit === "GiB") return `${(used / 1024).toFixed(1)}/${(total / 1024).toFixed(1)} GiB`;
  return `${(used / 1024 / 1024).toFixed(2)}/${(total / 1024 / 1024).toFixed(2)} TiB`;
}

function fmtTemp(c, unit) {
  if (unit === "C") return `${c}\u00b0C`;
  return `${Math.round((c * 9) / 5 + 32)}\u00b0F`;
}

function sevClass(pct) {
  if (pct >= 85) return "bg-red";
  if (pct >= 60) return "bg-yellow";
  return "bg-green";
}

function sevTempClass(t) {
  if (t >= 80) return "bg-red";
  if (t >= 70) return "bg-yellow";
  return "bg-green";
}

function Bar(props) {
  const width = createMemo(() => `width: ${Math.min(100, Math.max(0, props.pct))}%`);
  const barCls = createMemo(() => `h-full rounded-full ${props.barClass} transition-all duration-500`);
  return html`
    <div class="flex items-center gap-3 font-mono text-sm">
      <span class="w-20 sm:w-32 shrink-0 text-dim">${props.label}</span>
      <div class="flex-1 h-2.5 rounded-full bg-track overflow-hidden">
        <div
          class=${barCls}
          style=${width}
        ></div>
      </div>
      <span class="w-24 sm:w-40 shrink-0 text-right text-ink">${props.value}</span>
    </div>`;
}

function GpuCard(props) {
  const memPct = createMemo(() =>
    props.gpu.memoryTotalMb > 0 ? (props.gpu.memoryUsedMb / props.gpu.memoryTotalMb) * 100 : 0);
  const pwrPct = createMemo(() =>
    props.gpu.powerLimitW > 0 ? (props.gpu.powerDrawW / props.gpu.powerLimitW) * 100 : 0);

  return html`
    <div class="glass rounded-xl p-3 sm:p-5 flex flex-col gap-3">
      <div class="mb-1">
        <div class="flex flex-wrap items-baseline gap-x-2">
          <span class="font-mono text-accent font-semibold">${props.gpu.name}</span>
          <span class="text-xs text-dim font-mono">(GPU #${props.gpu.index})</span>
        </div>
        <div class="text-xs text-dim font-mono opacity-60">${props.gpu.uuid}</div>
      </div>

      <${Bar}
        label="GPU Utilization"
        pct=${props.gpu.utilizationGpu}
        value=${`${props.gpu.utilizationGpu}%`}
        barClass=${sevClass(props.gpu.utilizationGpu)}>
      <//>
      <${Bar}
        label="VRAM"
        pct=${memPct}
        value=${fmtMemRange(props.gpu.memoryUsedMb, props.gpu.memoryTotalMb, props.unit)}
        barClass=${sevClass(memPct())}>
      <//>
      <${Bar}
        label="Temp"
        pct=${Math.min(100, props.gpu.temperatureC)}
        value=${fmtTemp(props.gpu.temperatureC, props.tempUnit)}
        barClass=${sevTempClass(props.gpu.temperatureC)}>
      <//>
      <${Bar}
        label="Power"
        pct=${pwrPct}
        value=${`${Math.round(props.gpu.powerDrawW)}/${Math.round(props.gpu.powerLimitW)} W`}
        barClass=${sevClass(pwrPct())}>
      <//>
      <${Bar}
        label="Fan"
        pct=${props.gpu.fanSpeedPct || 0}
        value=${props.gpu.fanSpeedPct ? `${props.gpu.fanSpeedPct}%` : "N/A"}
        barClass="bg-cyan">
      <//>
    </div>`;
}

function ProcTable(props) {
  const rows = createMemo(() =>
    props.snapshot.gpus.map((g) =>
      (g.processes || []).map((p) => ({
        gpuIndex: g.index, pid: p.pid, name: p.name, mem: p.memoryUsedMb,
      }))
    ).flat());

  return html`
    <div class="glass rounded-xl overflow-hidden">
      <div class="px-3 sm:px-5 py-3 border-b border-rowline font-mono text-accent font-semibold">
        Processes:
      </div>
      <table class="w-full font-mono text-sm">
        <thead>
          <tr class="text-dim text-xs uppercase tracking-wide">
            <th class="text-left px-3 sm:px-5 py-2 font-medium">GPU</th>
            <th class="text-right px-3 py-2 font-medium">PID</th>
            <th class="text-left px-3 py-2 font-medium">Process name</th>
            <th class="text-right px-3 sm:px-5 py-2 font-medium">GPU Memory</th>
          </tr>
        </thead>
        <tbody>
          <${For} each=${rows}>
            ${(r) => html`
              <tr class="border-t border-rowline hover:bg-rowhover">
                <td class="px-3 sm:px-5 py-2 text-accent">${r.gpuIndex}</td>
                <td class="px-3 py-2 text-right text-ink">${r.pid}</td>
                <td class="px-3 py-2 text-ink-soft truncate max-w-md" title=${r.name}>${r.name}</td>
                <td class="px-3 sm:px-5 py-2 text-right text-cyan">${fmtMem(r.mem, props.unit)}</td>
              </tr>`}
          <//>
          <${Show} when=${() => rows().length === 0}>
            <tr>
              <td class="px-3 sm:px-5 py-6 text-center text-dim" colspan="4">No compute processes running.</td>
            </tr>
          <//>
        </tbody>
      </table>
    </div>`;
}

function App() {
  const [snapshot, setSnapshot] = createSignal(null);
  const [error, setError] = createSignal(null);
  const [lastUpdated, setLastUpdated] = createSignal(null);
  const [unit, setUnit] = createSignal("GiB");
  const [tempUnit, setTempUnit] = createSignal("C");
  const [theme, setTheme] = createSignal(initialTheme());

  function toggleTheme() {
    const next = theme() === "dark" ? "light" : "dark";
    setTheme(next);
    document.documentElement.dataset.theme = next;
    localStorage.setItem("nsl-theme", next);
  }

  async function refresh() {
    try {
      const res = await fetch("/api/snapshot");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      setSnapshot(await res.json());
      setError(null);
      setLastUpdated(new Date());
    } catch (e) {
      setError(String(e));
    }
  }

  onSettled(() => {
    refresh();
    const id = setInterval(refresh, REFRESH_MS);
    return () => clearInterval(id);
  });

  const driver = createMemo(() => snapshot()?.gpus?.[0]?.driver || "N/A");
  const timestamp = createMemo(() =>
    lastUpdated()
      ? lastUpdated().toLocaleString("en-US", {
          weekday: "short", month: "short", day: "2-digit",
          hour: "2-digit", minute: "2-digit", second: "2-digit",
          hour12: false, year: "numeric",
        })
      : "\u2014");

  return html`
    <div class="max-w-6xl mx-auto px-3 py-6 sm:px-6 sm:py-10">
      <header class="flex items-center justify-between mb-8 flex-wrap gap-4">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight flex items-center gap-3">
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-accent live-dot"></span>
            nvidia-smi<span class="text-accent -ml-3">-live</span>
          </h1>
          <p class="text-sm text-ink-soft mt-1">
            Live GPU monitor \u00b7
            <span class="font-mono text-ink">localhost</span>
          </p>
        </div>
        <div class="flex items-center gap-3">
          <select
            class="glass rounded-lg px-3 py-2 text-sm text-ink outline-none focus:ring-1 focus:ring-accent bg-panel"
            value=${unit}
            onChange=${(e) => setUnit(e.currentTarget.value)}
          >
            <option value="MiB">MiB</option>
            <option value="GiB">GiB</option>
            <option value="TiB">TiB</option>
          </select>
          <select
            class="glass rounded-lg px-3 py-2 text-sm text-ink outline-none focus:ring-1 focus:ring-accent bg-panel"
            value=${tempUnit}
            onChange=${(e) => setTempUnit(e.currentTarget.value)}
          >
            <option value="C">\u00b0C</option>
            <option value="F">\u00b0F</option>
          </select>
          <button
            type="button"
            onClick=${toggleTheme}
            class="glass rounded-lg p-2 text-ink-soft hover:text-ink outline-none focus:ring-1 focus:ring-accent"
            title=${() => (theme() === "dark" ? "Switch to light" : "Switch to dark")}
            aria-label=${() => (theme() === "dark" ? "Switch to light theme" : "Switch to dark theme")}
          >
            <${Show}
              when=${() => theme() === "dark"}
              fallback=${html`
                <svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor" aria-hidden="true">
                  <path d="M12 3a9 9 0 1 0 9 9c0-.34-.02-.67-.05-1A7 7 0 0 1 13 4.05c-.33-.03-.66-.05-1-.05Z" />
                </svg>`}
            >
              <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path
                  stroke-linecap="round"
                  d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.1 5.1l1.4 1.4M17.5 17.5l1.4 1.4M18.9 5.1l-1.4 1.4M6.5 17.5l-1.4 1.4"
                />
              </svg>
            <//>
          </button>
          <span class="text-xs text-ink-faint font-mono">
            ${() => (snapshot() ? `${snapshot().gpuCount} GPU${snapshot().gpuCount === 1 ? "" : "s"}` : "\u2026")}
          </span>
        </div>
      </header>

      <${Show} when=${error}>
        ${(e) => html`
          <div class="mb-6 rounded-lg border border-red/30 bg-red/10 text-red text-sm px-4 py-3 flex items-center justify-between">
            <span class="font-mono">error: ${e()}</span>
            <button onClick=${() => setError(null)} class="text-red ml-4">\u2715</button>
          </div>`}
      <//>

      <${Show} when=${snapshot} fallback=${html`<div class="text-ink-faint text-sm font-mono">Waiting for first snapshot\u2026</div>`}>
        ${(snap) => {
          return html`
            <div class="space-y-8">
              <${Show} when=${() => (snap().gpus.length > 0 ? snap() : null)} fallback=${html`<div class="glass rounded-xl p-10 text-center text-ink-faint">No GPUs detected.</div>`}>
                ${(s) => html`
                  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <${For} each=${() => s().gpus}>
                      ${(g) => html`<${GpuCard} gpu=${g} unit=${unit} tempUnit=${tempUnit}><//>`}
                    <//>
                  </div>`}
              <//>

              <${ProcTable} snapshot=${snap} unit=${unit}><//>
            </div>`;
        }}
      <//>

      <footer class="mt-10 flex items-center justify-between text-xs text-ink-faint font-mono flex-wrap gap-2">
        <span>
          NVIDIA-SMI <span class="text-accent">${driver}</span>
          <span class="text-dim ml-4">KMD Version: ${driver}</span>
        </span>
        <span class="text-cyan">
          ${timestamp}
        </span>
      </footer>
    </div>`;
}

render(App, document.getElementById("app"));
</script>
</body>
</html>
